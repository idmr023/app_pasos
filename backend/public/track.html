<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Pasos - Seguimiento en vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #0b0f1a; color: #fff; }
    #map { height: 60dvh; min-height: 320px; width: 100%; }
    .bar { padding: 10px 14px; background: #12172b; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .stat { font-size: 14px; }
    .stat b { color: #ff6b35; }
    .chat { min-height: 35dvh; display: flex; flex-direction: column; border-top: 1px solid #222; }
    .msgs { flex: 1; overflow-y: auto; padding: 10px; }
    .msg { margin-bottom: 6px; font-size: 13px; }
    .msg .name { font-weight: bold; color: #ff6b35; }
    .inputrow { display: flex; padding: 8px; gap: 8px; background: #12172b; }
    input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #0b0f1a; color: #fff; }
    button { padding: 8px 12px; border: none; border-radius: 6px; background: #ff6b35; color: #fff; cursor: pointer; }
    .banner { background: #d32f2f; padding: 8px 14px; font-weight: bold; }
    .inputrow[hidden] { display: none; }
    /* Ánimo en vivo (power-ups) */
    .cheers { padding: 8px 10px 4px; background: #12172b; border-top: 1px solid #222; }
    .cheers[hidden], .pubar[hidden] { display: none; }
    .energy { font-size: 12px; color: #ffb38f; margin-bottom: 6px; }
    .pubar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .pu { position: relative; flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; padding: 0;
          font-size: 22px; background: conic-gradient(#ff6b35 calc(var(--p, 1) * 360deg), #2a2f45 0);
          transition: transform .15s; }
    .pu::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #1b2038; }
    .pu span { position: relative; }
    .pu.cool span { opacity: .45; }
    .pu:active { transform: scale(1.15); }
    .msg.pu-msg { color: #ffb38f; font-weight: 600; }
    #burst { position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.3); font-size: 72px;
             pointer-events: none; opacity: 0; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .6s; }
    #burst.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    @media (max-width: 600px) {
      #map { height: 55dvh; min-height: 280px; }
      .bar { gap: 6px 12px; padding: 9px 12px; }
      .stat { flex: 1 1 42%; font-size: 12px; }
      .chat { min-height: 45dvh; }
      .inputrow { flex-wrap: wrap; }
      #nameInput { flex: 1 1 40%; }
      #msgInput { flex: 1 1 100%; order: 3; }
      #sendBtn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="stat">Sala: <b id="code"></b></div>
    <div class="stat">Distancia: <b id="dist">--</b> km</div>
    <div class="stat" id="remainingStat" hidden>Faltan: <b id="remaining">--</b> km <span id="eta"></span></div>
    <div class="stat">Velocidad: <b id="speed">--</b> km/h</div>
    <div class="stat">Ritmo: <b id="pace">--</b></div>
  </div>
  <div id="stoppedBanner" class="banner" style="display:none"></div>
  <div id="map"></div>
  <div class="cheers" id="cheers">
    <div class="energy" id="energy">Energía del público: aún sin ánimos</div>
    <div class="pubar" id="pubar"></div>
  </div>
  <div id="burst"></div>
  <div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="inputrow" id="inputrow">
      <input id="nameInput" placeholder="Tu nombre" />
      <input id="msgInput" placeholder="Escribe un mensaje..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const code = (location.pathname.split('/').pop() || '').toUpperCase();
    document.getElementById('code').textContent = code;

    const map = L.map('map').setView([-12.0464, -77.0428], 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, OpenStreetMap contributors'
    }).addTo(map);

    const route = [];
    let marker = null;
    let activityEnded = false;
    const polyline = L.polyline(route, { color: '#ff6b35', weight: 5 }).addTo(map);

    function setMetric(id, val) { document.getElementById(id).textContent = val; }

    let guestName = localStorage.getItem('guestName') || 'Invitado';
    document.getElementById('nameInput').value = guestName;

    let socket = io(window.location.origin, {
      query: { roomCode: code, isRunner: 'false', guest: 'true', guestName: guestName }
    });

    // --- Ruta planificada (.gpx del corredor) y cuánto falta ---
    let planned = null; // { points: [[lat,lng]], cum: [m], total: m }
    let plannedLine = null, finishMarker = null, lastAlong = null, startedAt = null, lastDistKm = 0, lastTs = null;
    function hav(a, b) {
      const R = 6371000, r = Math.PI / 180;
      const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }
    function setPlanned(rt) {
      if (plannedLine) { map.removeLayer(plannedLine); plannedLine = null; }
      if (finishMarker) { map.removeLayer(finishMarker); finishMarker = null; }
      planned = null; lastAlong = null;
      document.getElementById('remainingStat').hidden = true;
      if (!rt || !Array.isArray(rt.points) || rt.points.length < 2) return;
      const pts = rt.points.map(p => [p[0], p[1]]);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hav(pts[i - 1], pts[i]));
      planned = { points: pts, cum, total: cum[cum.length - 1] };
      plannedLine = L.polyline(pts, { color: '#ffffff', weight: 7, opacity: 0.55, dashArray: '8 8' }).addTo(map);
      polyline.bringToFront();
      finishMarker = L.marker(pts[pts.length - 1], { title: 'Meta' }).addTo(map).bindTooltip('🏁 Meta');
      document.getElementById('remainingStat').hidden = false;
      setMetric('remaining', (planned.total / 1000).toFixed(1));
      if (!route.length) map.fitBounds(plannedLine.getBounds(), { padding: [20, 20] });
    }
    function updateRemaining(lat, lng) {
      if (!planned) return;
      const cosLat = Math.cos(lat * Math.PI / 180), k = 111320;
      const X = p => (p[1] - lng) * k * cosLat, Y = p => (p[0] - lat) * k;
      const searchBest = (from, to) => {
        let best = null;
        for (let i = from; i < to; i++) {
          const a = planned.points[i], b = planned.points[i + 1];
          const ax = X(a), ay = Y(a), dx = X(b) - ax, dy = Y(b) - ay;
          const len2 = dx * dx + dy * dy;
          let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;
          t = Math.max(0, Math.min(1, t));
          const px = ax + t * dx, py = ay + t * dy, d = Math.hypot(px, py);
          if (!best || d < best.d) best = { d, along: planned.cum[i] + t * (planned.cum[i + 1] - planned.cum[i]) };
        }
        return best;
      };
      const n = planned.points.length;
      let best = null;
      const hint = lastAlong != null ? lastAlong : (lastDistKm > 0.5 ? lastDistKm * 1000 - 300 : null);
      if (hint != null) {
        let from = 0; while (from < n - 2 && planned.cum[from + 1] < hint - 500) from++;
        let to = from; while (to < n - 1 && planned.cum[to] <= hint + 3000) to++;
        best = searchBest(from, Math.max(to, from + 1));
        if (best && best.d > 200) best = null;
      }
      if (!best) best = searchBest(0, n - 1);
      lastAlong = best.along;
      const remainingKm = Math.max(0, planned.total - best.along) / 1000;
      setMetric('remaining', remainingKm.toFixed(1));
      let eta = '';
      if (startedAt && lastTs && lastDistKm > 0.2) {
        const secPerKm = (lastTs - startedAt) / 1000 / lastDistKm;
        const mins = Math.round(secPerKm * remainingKm / 60);
        eta = mins >= 60 ? `(~${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min)` : `(~${mins} min)`;
      }
      document.getElementById('eta').textContent = eta + (best.d > 150 ? ' · fuera de ruta' : '');
    }

    function applyPoint(d, live) {
      const lat = d.latitude, lng = d.longitude;
      if (typeof lat !== 'number' || typeof lng !== 'number') return false;
      route.push([lat, lng]);
      if (typeof d.distance === 'number') lastDistKm = d.distance;
      if (d.timestamp) lastTs = new Date(d.timestamp).getTime();
      if (live) {
        setMetric('dist', (d.distance || 0).toFixed(2));
        setMetric('speed', ((d.speed || 0) * 3.6).toFixed(1));
        setMetric('pace', d.pace ? d.pace.toFixed(2) + ' min/km' : '--');
      }
      return true;
    }
    function moveMarker() {
      if (!route.length) return;
      const last = route[route.length - 1];
      polyline.setLatLngs(route);
      if (!marker) { marker = L.marker(last).addTo(map); map.setView(last, 15); }
      else marker.setLatLng(last);
      updateRemaining(last[0], last[1]);
    }

    socket.on('connect', () => console.log('connected'));
    socket.on('locationUpdate', (d) => {
      if (applyPoint(d, true)) moveMarker();
    });
    // Puntos que el corredor guardó sin señal y envió al reconectar.
    socket.on('locationBatch', (d) => {
      const pts = (d && Array.isArray(d.points)) ? d.points : [];
      pts.forEach((p, i) => applyPoint(p, i === pts.length - 1));
      moveMarker();
    });
    socket.on('routeUpdated', (d) => setPlanned(d && d.route));
    socket.on('trackingResumed', () => {
      activityEnded = false;
      const b = document.getElementById('stoppedBanner');
      b.style.display = 'none';
      document.getElementById('inputrow').hidden = false;
      document.getElementById('pubar').hidden = false;
    });

    function appendMessage(d) {
      const msgs = document.getElementById('msgs');
      const div = document.createElement('div');
      div.className = 'msg';
      if (d.kind === 'powerUp') {
        div.classList.add('pu-msg');
        div.textContent = d.message || '';
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
        return;
      }
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = (d.senderName || 'Espectador') + ':';
      div.appendChild(name);
      div.appendChild(document.createTextNode(' ' + (d.message || '')));
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    socket.on('chatMessage', (d) => {
      appendMessage(d);
    });

    // --- Ánimo en vivo (power-ups). Tipos = POWER_UP_TYPES de utils/powerUps.js
    const POWER_UPS = [
      ['turbo', '🔥', 'Turbo'], ['agua', '💧', 'Agua'], ['aplausos', '👏', 'Aplausos'],
      ['ultimoKm', '🏁', 'Último km'], ['ritmo', '⚡', 'Sube el ritmo'], ['fuerza', '💪', 'Tú puedes'],
      ['voz', '🎙️', 'Ánimo de voz'],
    ];
    const COOLDOWN_MS = 5000;
    let cooldownUntil = 0;
    const pubar = document.getElementById('pubar');
    POWER_UPS.forEach(([type, emoji, label]) => {
      const b = document.createElement('button');
      b.className = 'pu';
      b.title = label;
      b.setAttribute('aria-label', label);
      const sp = document.createElement('span');
      sp.textContent = emoji;
      b.appendChild(sp);
      b.addEventListener('click', () => sendPowerUp(type));
      pubar.appendChild(b);
    });
    function tickCooldown() {
      const left = Math.max(0, cooldownUntil - Date.now());
      const p = 1 - left / COOLDOWN_MS;
      pubar.querySelectorAll('.pu').forEach((b) => {
        b.style.setProperty('--p', p);
        b.classList.toggle('cool', left > 0);
      });
      if (left > 0) requestAnimationFrame(tickCooldown);
    }
    function startCooldown(ms) { cooldownUntil = Date.now() + ms; tickCooldown(); }
    function sendPowerUp(type) {
      if (activityEnded || Date.now() < cooldownUntil) return;
      let text;
      if (type === 'voz') {
        text = (prompt('Tu ánimo (máx. 80 caracteres). El corredor lo escuchará en voz alta:') || '').trim().slice(0, 80);
        if (!text) return;
      }
      const name = document.getElementById('nameInput').value.trim() || 'Invitado';
      localStorage.setItem('guestName', name);
      socket.emit('powerUp', { type, text, senderName: name });
      if (navigator.vibrate) navigator.vibrate(40);
      startCooldown(COOLDOWN_MS);
    }
    function renderEnergy(st) {
      if (!st) return;
      const top = st.topSupporter || (st.topSupporters && st.topSupporters[0]);
      document.getElementById('energy').textContent = st.total
        ? `🔥 ${st.total} ánimos · ${st.supporters} fans` + (top ? ` · Top: ${top.name} (${top.count})` : '')
        : 'Energía del público: aún sin ánimos';
    }
    let burstTimer = null;
    socket.on('powerUp', (d) => {
      appendMessage({ kind: 'powerUp', message: d.message });
      renderEnergy(d.stats);
      const burst = document.getElementById('burst');
      burst.textContent = d.emoji || '🔥';
      burst.classList.add('show');
      clearTimeout(burstTimer);
      burstTimer = setTimeout(() => burst.classList.remove('show'), 900);
    });
    socket.on('error', (d) => {
      if (d && d.code === 'POWERUP_COOLDOWN' && d.retryInMs) startCooldown(d.retryInMs);
    });
    fetch('/api/tracking/' + code + '/cheers')
      .then(r => r.json())
      .then(data => renderEnergy(data && data.cheers))
      .catch(() => {});

    socket.on('trackingStopped', (d) => {
      activityEnded = true;
      document.getElementById('pubar').hidden = true;
      const b = document.getElementById('stoppedBanner');
      b.style.display = 'block';
      b.textContent = 'Carrera finalizada — ' + ((d.totalDistance || 0).toFixed ? d.totalDistance.toFixed(2) : d.totalDistance) + ' km';
      document.getElementById('inputrow').hidden = true;
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim() || 'Invitado';
      const text = document.getElementById('msgInput').value.trim();
      if (!text || activityEnded) return;
      localStorage.setItem('guestName', name);
      socket.emit('chatMessage', { message: text, senderName: name });
      document.getElementById('msgInput').value = '';
    });

    // Cargar historial via REST
    // Todo el recorrido (muestreado) para carreras largas.
    fetch('/api/tracking/' + code + '/history?full=true&limit=4000')
      .then(r => r.json())
      .then(data => {
        if (data && Array.isArray(data.locations)) {
          route.length = 0;
          data.locations.forEach(l => applyPoint(l, false));
          const last = data.locations[data.locations.length - 1];
          if (last && typeof last.distance === 'number') setMetric('dist', last.distance.toFixed(2));
          moveMarker();
        }
      }).catch(() => {});

    fetch('/api/tracking/' + code + '/messages?limit=100')
      .then(r => r.json())
      .then(data => {
        if (data && Array.isArray(data.messages)) {
          data.messages.forEach(appendMessage);
        }
      }).catch(() => {});

    fetch('/api/tracking/' + code)
      .then(r => r.json())
      .then(data => {
        if (data?.session?.startedAt) startedAt = new Date(data.session.startedAt).getTime();
        if (data?.session?.plannedRoute) {
          setPlanned(data.session.plannedRoute);
          if (route.length) moveMarker();
        }
        if (data?.session?.status !== 'active') {
          activityEnded = true;
          document.getElementById('stoppedBanner').style.display = 'block';
          document.getElementById('stoppedBanner').textContent = 'Carrera finalizada';
          document.getElementById('inputrow').hidden = true;
          document.getElementById('pubar').hidden = true;
        }
      }).catch(() => {});
  </script>
</body>
</html>
